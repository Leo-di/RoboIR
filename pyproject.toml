[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboir"
version = "0.1.0"
description = "An embodied intermediate representation and execution layer for desk-level robot tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."roboir.plugins"]
deskservice = "roboir_plugins.deskservice:PLUGIN"

[project.scripts]
roboir = "roboir.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.md"]
